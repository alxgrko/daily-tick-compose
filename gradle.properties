## JVM arguments used for Gradle builds. Increase heap size to avoid out‑of‑memory errors
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

## Enable AndroidX and Jetifier
android.useAndroidX=true

## Do not generate transitive R classes to speed up builds
android.nonTransitiveRClass=true

## Follow the official Kotlin code style
kotlin.code.style=official

## Enable Compose by default for Android modules when using AGP 9.x
android.defaults.buildfeatures.compose=true

## Suppress Compose compiler plugin compatibility checks because we use the
## compose plugin from the Kotlin toolchain【202090595436927†L11-L16】.
android.experimental.compose.disableKotlinPluginWarnings=true
